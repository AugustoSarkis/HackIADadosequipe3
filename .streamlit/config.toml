[theme]
# Roxo Dados (Primary Color)
# Mantemos o roxo vibrante do seu núcleo para os botões principais e barras de progresso.
# É a cor que vai guiar o clique do usuário.
primaryColor = "#9D4EDD"

# Azul Poli Profundo (Background Color)
# Em vez de preto puro (que é muito agressivo), usamos um azul marinho extremamente escuro.
# Traz a identidade da Poli Júnior de forma elegante e descansa os olhos.
backgroundColor = "#0A192F"

# Azul Poli Intermediário (Secondary Background Color)
# Um tom de azul marinho levemente mais claro para a barra lateral e caixas de texto.
# Cria uma separação visual sofisticada do fundo.
secondaryBackgroundColor = "#112240"

# Branco Gelo/Azulado (Text Color)
# NUNCA use cores super saturadas (como laranja) para ler relatórios. 
# Este "off-white" garante contraste perfeito contra o azul escuro sem ofuscar a visão.
textColor = "#E6F1FF"

# Fonte sem serifa, limpa e padronizada.
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false