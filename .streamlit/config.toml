[theme]
# Roxo Normal/Vibrante (Primary Color)
# Usado para botões, barras de carregamento e destaques. É o roxo "elétrico" 
# que chama a atenção do usuário para a ação principal.
primaryColor = "#9D4EDD"

# Roxo Bem Escuro (Background Color)
# Substitui o preto/cinza do fundo por um roxo extremamente profundo (quase meia-noite).
# Isso cria o clima noturno e tecnológico, mas sem ser um preto sem graça.
backgroundColor = "#130525"

# Roxo Escuro/Intermediário (Secondary Background Color)
# Usado na barra lateral e no fundo de áreas de texto/upload. É um tom de roxo 
# levemente mais claro que o fundo principal para criar uma "camada" visual sobreposta.
secondaryBackgroundColor = "#220B3D"

# Roxo Muito Claro/Lilás (Text Color)
# Em telas escuras, texto branco puro pode "estourar" a visão após muita leitura. 
# Usar um lilás super claro (quase branco) mantém o contraste excelente para ler 
# as atas longas, descansando os olhos e mantendo a harmonia de cores.
textColor = "#F3E8FF"

# Fonte sem serifa, limpa e padronizada para dashboards de dados.
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false