[theme]
# A cor principal do seu app (usada em botões primários, barras de progresso e ícones)
# Um roxo elétrico e vibrante para dar o destaque tecnológico exato do núcleo.
primaryColor = "#7C3AED"

# A cor de fundo principal da área onde as atas e resultados vão aparecer.
# Substituímos o branco por um tom de "grafite/noturno" de IDEs para conforto visual.
backgroundColor = "#0E1117"

# A cor de fundo da barra lateral (sidebar) e dos fundos dos inputs (como o uploader).
# Um cinza-azulado levemente mais claro que o fundo principal para criar profundidade.
secondaryBackgroundColor = "#1A1C23"

# A cor do texto principal.
# Como o fundo agora é escuro, o texto precisa ser invertido para um "off-white" 
# (quase branco), garantindo alto contraste e leitura dinâmica sem ofuscar a visão.
textColor = "#FAFAFA"

# A família de fontes (mantida limpa e moderna).
font = "sans serif"

[server]
# Ocultar o menu padrão e a marca d'água para manter a cara de software próprio.
enableCORS = false
enableXsrfProtection = false